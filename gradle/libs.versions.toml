[versions]
mapstruct = "1.6.3"
archunit-junit5 = "1.5.0"
blockhound-junit-platform = "1.0.17.RELEASE"
micrometer-context-propagation = "1.2.1"
checkstyle = "13.10.0"
jacoco = "0.8.15"
gatling-plugin = "3.15.1.2"
gatling-highcharts = "3.15.1"
# jhipster-needle-gradle-dependency-catalog-version - JHipster will add additional versions for convention plugins here

[libraries]
jhipster-framework = { module = "tech.jhipster:jhipster-framework", version = "8.12.0" }
