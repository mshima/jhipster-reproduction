graalvmNative {
  toolchainDetection = true
  binaries {
    main {
      imageName = 'native-executable'
      //this is only needed when you toolchain can't be detected
      //javaLauncher = javaToolchains.launcherFor {
      //  languageVersion = JavaLanguageVersion.of(19)
      //  vendor = JvmVendorSpec.matching("GraalVM Community")
      //}
      verbose = true
      buildArgs.add("-Duser.language=en")
      buildArgs.add("-H:IncludeLocales=en")
      buildArgs.add('-J-Xms2g')
      buildArgs.add('-J-Xmx3g')
      buildArgs.add('--parallelism=2')
      buildArgs.add('-O1')
    }
  }
  metadataRepository {
    enabled = true
    version = '1.0.9'
  }
}

processTestAot {
  jvmArgs += ["-XX:+AllowRedefinitionToAddDeleteMethods"]
}

if (project.hasProperty("native")) {
  hibernate {
    enhancement {
      enableLazyInitialization = true
    }
  }
}
