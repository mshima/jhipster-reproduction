<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-custom-package-child-heading"
        data-cy="CustomPackageChildCreateUpdateHeading"
        jhiTranslate="sampleWebfluxH2MemApp.customPackageChild.home.createOrEditLabel"
      >
        Create or edit a Custom Package Child
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="global.field.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_childName" jhiTranslate="sampleWebfluxH2MemApp.customPackageChild.childName"
            >Child Name</label
          >
          <input type="text" class="form-control" name="childName" id="field_childName" data-cy="childName" formControlName="childName" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_user" jhiTranslate="sampleWebfluxH2MemApp.customPackageChild.user">User</label>
          <select class="form-control" id="field_user" data-cy="user" name="user" formControlName="user" [compareWith]="compareUser">
            <option [ngValue]="null"></option>
            @for (userOption of usersSharedCollection(); track $index) {
              <option [ngValue]="userOption">{{ userOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label
            class="form-label"
            for="field_customPackageParent"
            jhiTranslate="sampleWebfluxH2MemApp.customPackageChild.customPackageParent"
            >Custom Package Parent</label
          >
          <select
            class="form-control"
            id="field_customPackageParent"
            data-cy="customPackageParent"
            name="customPackageParent"
            formControlName="customPackageParent"
            [compareWith]="compareCustomPackageParent"
          >
            <option [ngValue]="null"></option>
            @for (customPackageParentOption of customPackageParentsSharedCollection(); track $index) {
              <option [ngValue]="customPackageParentOption">{{ customPackageParentOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
