<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (entityWithPaginationAndDTO(); as entityWithPaginationAndDTORef) {
      <div>
        <h2 data-cy="entityWithPaginationAndDTODetailsHeading">
          <span jhiTranslate="sampleWebfluxPsqlApp.entityWithPaginationAndDTO.detail.title">Entity With Pagination And DTO</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ entityWithPaginationAndDTORef.id }}</span>
          </dd>
          <dt><span jhiTranslate="sampleWebfluxPsqlApp.entityWithPaginationAndDTO.lea">Lea</span></dt>
          <dd>
            <span>{{ entityWithPaginationAndDTORef.lea }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button
          type="button"
          [routerLink]="['/entity-with-pagination-and-dto', entityWithPaginationAndDTORef.id, 'edit']"
          class="btn btn-primary"
        >
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
