<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (mapsIdUserProfileWithDTO(); as mapsIdUserProfileWithDTORef) {
      <div>
        <h2 data-cy="mapsIdUserProfileWithDTODetailsHeading">
          <span jhiTranslate="sampleWebfluxPsqlApp.mapsIdUserProfileWithDTO.detail.title">Maps Id User Profile With DTO</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ mapsIdUserProfileWithDTORef.id }}</span>
          </dd>
          <dt><span jhiTranslate="sampleWebfluxPsqlApp.mapsIdUserProfileWithDTO.dateOfBirth">Date Of Birth</span></dt>
          <dd>
            <span>{{ mapsIdUserProfileWithDTORef.dateOfBirth | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="sampleWebfluxPsqlApp.mapsIdUserProfileWithDTO.user">User</span></dt>
          <dd>
            <span>{{ mapsIdUserProfileWithDTORef.user?.login }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button
          type="button"
          [routerLink]="['/maps-id-user-profile-with-dto', mapsIdUserProfileWithDTORef.id, 'edit']"
          class="btn btn-primary"
        >
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
